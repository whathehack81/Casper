[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casper"
version = "0.1.0"
description = "Casper research workflow engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
packages = { find = { include = ["casper*"] } }
py-modules = ["gatekeeper"]

[project.scripts]
casper = "casper.cli:main"
casper-tools = "casper.tools_cli:main"

[[tool.mypy.overrides]]
module = "casper.rip.validation"
ignore_errors = true
